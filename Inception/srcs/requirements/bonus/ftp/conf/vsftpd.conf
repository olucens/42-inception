# ---------------------------------------------------------------------------
# vsftpd configuration.
# ---------------------------------------------------------------------------

# Standalone mode: vsftpd binds the port itself instead of being spawned per
# connection by inetd. In a container there is no inetd, and we need a
# long-lived PID 1.
listen=YES
listen_ipv6=NO

# No anonymous access. The site's files are not public for writing.
anonymous_enable=NO

# Authenticate against real system users (created by the entrypoint from a
# Docker secret).
local_enable=YES
write_enable=YES
local_umask=022

# --- chroot: confine the user to the WordPress directory --------------------
# Without this, an authenticated FTP user could browse the container's entire
# filesystem — /etc/passwd, /run/secrets, everything.
chroot_local_user=YES

# vsftpd refuses to chroot into a directory the user can write, because a
# writable chroot root is a known privilege-escalation vector. Here the whole
# point is uploading files, so the check is disabled deliberately. The residual
# risk is contained: the chroot is a volume inside a container that has nothing
# else in it.
allow_writeable_chroot=YES

# --- Passive mode -----------------------------------------------------------
# WHY passive mode is not optional in Docker:
# in ACTIVE mode the server opens a data connection back TO the client. The
# server here sits behind Docker's NAT with a private address, so that
# connection cannot be established. In PASSIVE mode the client opens both
# connections, which works through NAT.
#
# The port range must be published in docker-compose.yml exactly as written
# here: the server tells the client which port to connect to, and if that port
# is not forwarded the control channel works but every transfer hangs — the
# classic "login succeeds, LIST times out" symptom.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# The address the server advertises for passive connections. Set at runtime by
# the entrypoint from FTP_PASV_ADDRESS, because the container cannot know the
# host's address by itself.
# pasv_address=<injected at runtime>

# Only the users listed in this file may log in — a whitelist, not a blacklist.
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# --- Logging ----------------------------------------------------------------
# WHY a plain file and NOT /dev/stdout, which is the usual container idiom:
# vsftpd opens its log from a privilege-separated process, and /dev/stdout is a
# symlink to /proc/self/fd/1 — "self" being that process, not PID 1. The open
# fails and vsftpd refuses every connection with
#   500 OOPS: failed to open vsftpd log file:/dev/stdout
# before the banner is even sent. The entrypoint therefore symlinks this path to
# /proc/1/fd/1 (PID 1's stdout, which IS what Docker captures) and falls back to
# a real file if that is not writable.
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
syslog_enable=NO
vsftpd_log_file=/var/log/vsftpd.log

# Cosmetic but useful: shows real file listings and a clear banner.
dirmessage_enable=YES
use_localtime=YES
seccomp_sandbox=NO
ftpd_banner=Inception FTP - WordPress volume
