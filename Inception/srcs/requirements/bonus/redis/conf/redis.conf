# ---------------------------------------------------------------------------
# Redis configuration — tuned as a CACHE, not as a database.
# ---------------------------------------------------------------------------

# All interfaces of THIS container. As with MariaDB, 127.0.0.1 would mean the
# container's own loopback and WordPress could never connect. The port is never
# published, so "all interfaces" is the loopback plus one veth on
# inception-network.
bind 0.0.0.0
port 6379

# WHY protected-mode is off. With no password set, protected-mode makes Redis
# refuse every non-loopback connection — WordPress would be rejected. The
# boundary here is the network: 6379 is EXPOSEd, never published, so only a
# container on inception-network can open a socket at all.
#
# The honest trade-off: any container on this network can read the cache. That
# is acceptable for this stack (the cache holds query results, not credentials),
# and the fix if it ever stops being acceptable is `requirepass` from a Docker
# secret plus WP_REDIS_PASSWORD in wp-config.php.
protected-mode no

# --- THIS is what "properly manage the cache" means -------------------------
#
# A cache must have a bounded size and an eviction policy. Without them Redis
# grows until the container hits its memory limit and gets OOM-killed — and a
# crash-looping cache is worse than no cache.
#
# maxmemory     : hard ceiling for the dataset.
# allkeys-lru   : when full, evict the least recently used key, from ANY key.
#
# Why allkeys-lru and not the default `noeviction`: noeviction makes Redis
# answer writes with an OOM error once full. WordPress would then log errors
# instead of caching. Why not volatile-lru: that only evicts keys carrying a
# TTL, and WordPress writes many cache entries without one — Redis would fill up
# with unevictable keys and still return OOM.
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Persistence: deliberately disabled -------------------------------------
#
# This is a cache. Every value in it can be recomputed from MariaDB, which is
# the actual source of truth. Persisting it would buy nothing and cost real
# disk I/O (RDB forks the process; AOF writes every mutation).
#
# This is also why this service has NO volume, while mariadb and wordpress do.
# The subject says each bonus service gets a dedicated volume "if necessary" —
# here it is not, and being able to say why is the point.
save ""
appendonly no

# Log to stdout so `docker compose logs redis` shows it.
logfile ""
loglevel notice

# `docker stop` sends SIGTERM; without this Redis treats it as an unclean
# shutdown and complains on every restart.
databases 16
stop-writes-on-bgsave-error no
