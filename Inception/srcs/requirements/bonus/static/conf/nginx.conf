# ---------------------------------------------------------------------------
# NGINX configuration for the static site.
# Plain HTTP on 8080 — TLS is not required here, and the subject's TLS rule
# applies to the mandatory entry point, not to a bonus service.
# ---------------------------------------------------------------------------
user  www-data;
worker_processes auto;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Static assets never change within an image build, so they can be cached
    # hard by the browser. The HTML itself is left uncached so a redeploy is
    # visible immediately.
    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /var/www/static;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|svg|woff2|png|jpg|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Defence in depth even for a read-only site.
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
    }
}
