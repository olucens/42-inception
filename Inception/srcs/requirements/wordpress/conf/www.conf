; ---------------------------------------------------------------------------
; PHP-FPM pool configuration.
; Replaces Debian's /etc/php/8.2/fpm/pool.d/www.conf.
; ---------------------------------------------------------------------------
[www]

; The pool's worker processes drop to this unprivileged user. The FPM *master*
; still starts as root — that is required in order to setuid() the workers and
; is the normal, correct FPM model.
user  = www-data
group = www-data

; WHY a TCP socket (0.0.0.0:9000) and not a UNIX socket:
; a UNIX socket is a file in one container's mount namespace. NGINX lives in a
; DIFFERENT container, so it cannot see that file — the two processes only share
; a network. Listening on 0.0.0.0:9000 lets NGINX reach us as
; `fastcgi_pass wordpress:9000`, resolved by Docker's embedded DNS.
listen = 0.0.0.0:9000

; NOTE on listen.allowed_clients: it is deliberately NOT set.
; FastCGI is an unauthenticated protocol, so restricting the client would be
; good defence in depth — but the only legitimate client, the NGINX container,
; connects from an address Docker's IPAM assigns dynamically on each `up`, and
; this directive accepts literal IPs only (no names, no CIDR). Pinning it would
; break the stack on the next restart. The real control here is the network
; boundary: port 9000 is EXPOSEd, never published, so nothing outside
; inception-network can open a socket to it at all.

; ondemand: workers are forked when a request arrives and reaped after
; pm.process_idle_timeout. On a 1-visitor evaluation VM this keeps idle memory
; near zero. `dynamic` would keep pm.start_servers alive doing nothing.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

; WHY logs go to file descriptor 2:
; a container has no syslog and no logrotate. Docker captures the PID 1 process's
; stdout/stderr — that is what `docker compose logs wordpress` shows. Writing to
; /proc/self/fd/2 puts PHP errors where the operator will actually look.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no
