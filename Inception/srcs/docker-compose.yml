# ---------------------------------------------------------------------------
# Inception — three tiers, three containers, one private network.
#
#   internet/host  --443/tls-->  nginx  --fastcgi:9000-->  wordpress
#                                                              |
#                                                          mysql:3306
#                                                              v
#                                                           mariadb
#
# NOTE: there is no `version:` key. It has been obsolete since Compose v2 and
# current versions print a warning when it is present.
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # Data tier. No published port: reachable only from inside the network.
  # -------------------------------------------------------------------------
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    # Subject: "Each Docker image must have the same name as its corresponding
    # service." The `:inception` tag is explicit because `latest` is prohibited
    # and an untagged name defaults to exactly that.
    image: mariadb:inception
    container_name: mariadb
    env_file: .env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - inception-network
    # Subject: "Your containers have to restart in case of a crash."
    # on-failure restarts only on a non-zero exit — a crash. `always` would also
    # restart a container the operator stopped on purpose, which fights `docker
    # compose stop` during a demo.
    restart: on-failure
    # expose = documentation + intra-network reachability. `ports:` would open a
    # hole in the host firewall; the DB must never be reachable from outside.
    expose:
      - "3306"

  # -------------------------------------------------------------------------
  # Application tier. Speaks FastCGI only — no web server in this container.
  # -------------------------------------------------------------------------
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:inception
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception-network
    # depends_on orders CONTAINER START only — it does not wait for mysqld to
    # accept queries. The real readiness gate is the bounded retry loop in
    # tools/setup.sh. Both are needed: this for ordering, that for readiness.
    depends_on:
      - mariadb
      # BONUS: ordering only. setup.sh treats a missing Redis as non-fatal — the
      # site must still serve, just uncached — so no readiness gate is needed.
      - redis
    restart: on-failure
    expose:
      - "9000"

  # -------------------------------------------------------------------------
  # Edge tier. The ONLY service with `ports:` — the single entry point.
  # -------------------------------------------------------------------------
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    image: nginx:inception
    container_name: nginx
    env_file: .env
    volumes:
      # Same named volume as WordPress, mounted read-only. NGINX serves the
      # static assets directly off disk; it has no reason to write, and :ro
      # means a compromised NGINX cannot plant a PHP file for FPM to execute.
      - wordpress-data:/var/www/html:ro
    networks:
      - inception-network
    depends_on:
      - wordpress
    restart: on-failure
    ports:
      # host:container. 443 only — no 80, no redirect. Subject: "the only entry
      # point into your infrastructure via the port 443 only".
      - "443:443"

  # =========================================================================
  # BONUS SERVICES
  #
  # Subject: "A Dockerfile must be written for each additional service. Thus,
  # each service will run inside its own container and will have, if necessary,
  # its dedicated volume."
  #
  # Note "if necessary": redis, static and adminer deliberately have NO volume,
  # and each can say why. Only `backup` gains one, because a dump that is not
  # stored somewhere separate from the database is not a backup.
  #
  # Subject: "you may open more ports to suit your needs" — which is what makes
  # the published ports below legitimate without weakening the mandatory rule
  # that NGINX is the only entry point to the WordPress site itself.
  # =========================================================================

  # -------------------------------------------------------------------------
  # Redis — persistent object cache for WordPress.
  # -------------------------------------------------------------------------
  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis:inception
    container_name: redis
    env_file: .env
    networks:
      - inception-network
    restart: on-failure
    # No volume, on purpose: every value in this cache is derivable from
    # MariaDB, which is the source of truth. Persisting a cache buys nothing and
    # costs disk I/O.
    #
    # Not published: only WordPress needs it, and an internet-facing Redis with
    # no password is a well-known way to lose a server.
    expose:
      - "6379"

  # -------------------------------------------------------------------------
  # FTP — file access to the WordPress volume.
  # -------------------------------------------------------------------------
  ftp:
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp:inception
    container_name: ftp
    env_file: .env
    secrets:
      - ftp_password
    volumes:
      # The SAME named volume WordPress writes and NGINX reads. This is the
      # requirement: "pointing to the volume of your WordPress website".
      # Read-write here — uploading files is the entire purpose.
      - wordpress-data:/var/www/html
    networks:
      - inception-network
    depends_on:
      - wordpress
    restart: on-failure
    ports:
      # 21 is the control channel. The 21100-21110 range is the PASSIVE data
      # range and must match pasv_min_port/pasv_max_port in vsftpd.conf exactly:
      # the server names one of these ports to the client, and if it is not
      # forwarded the login succeeds but every transfer hangs.
      - "21:21"
      - "21100-21110:21100-21110"

  # -------------------------------------------------------------------------
  # Static site — plain HTML/CSS/JS, no PHP.
  # -------------------------------------------------------------------------
  static:
    build:
      context: requirements/bonus/static
      dockerfile: Dockerfile
    image: static:inception
    container_name: static
    networks:
      - inception-network
    restart: on-failure
    # No volume: the site is immutable content baked into the image, so it
    # belongs to an image version rather than to runtime state.
    ports:
      - "8080:8080"

  # -------------------------------------------------------------------------
  # Adminer — database web UI.
  # -------------------------------------------------------------------------
  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer:inception
    container_name: adminer
    env_file: .env
    networks:
      - inception-network
    depends_on:
      - mariadb
    restart: on-failure
    # No volume and no secrets: Adminer holds no state, and credentials are
    # typed into its login form rather than stored anywhere in the image.
    ports:
      - "8081:8080"

  # -------------------------------------------------------------------------
  # Backup — scheduled mariadb-dump. The "service of your choice".
  # -------------------------------------------------------------------------
  backup:
    build:
      context: requirements/bonus/backup
      dockerfile: Dockerfile
    image: backup:inception
    container_name: backup
    env_file: .env
    secrets:
      - db_password
    volumes:
      # Its OWN volume, separate from mariadb-data. A backup written next to the
      # data it protects dies with it — `down -v`, a bad disk, or a wrong path
      # would take both. Separation is the whole guarantee.
      - backup-data:/backups
    networks:
      - inception-network
    depends_on:
      - mariadb
    restart: on-failure
    # Nothing published: it is a scheduler, it serves no requests.

# ---------------------------------------------------------------------------
# Secrets. Subject: "It is strongly recommended that you use Docker secrets to
# store any confidential information."
#
# Each file is mounted read-only at /run/secrets/<name>. Note the precise
# mechanism, because it is a fair defence question: in Docker SWARM, secrets are
# distributed over the encrypted raft log and mounted on an in-memory tmpfs. In
# Compose (what this project uses) a secret is a read-only BIND MOUNT of the
# host file — verify with `docker exec wordpress grep secrets /proc/mounts`.
#
# The security win over environment variables is real either way: a secret is
# not printed by `docker inspect`, not printed by `docker compose config`, not
# inherited into every child process's /proc/<pid>/environ, and not baked into
# an image layer that `docker history` can dump.
#
# ../secrets/ is git-ignored. Subject: "Any credentials, API keys, or passwords
# found in your Git repository will result in project failure."
# ---------------------------------------------------------------------------
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
  # BONUS
  ftp_password:
    file: ../secrets/ftp_password.txt

# ---------------------------------------------------------------------------
# Volumes. Subject: "You must use docker named volumes for these two persistent
# storages. Bind mounts are not allowed for these volumes." AND "Both named
# volumes must store their data inside /home/login/data on the host machine."
#
# Those two rules pull in opposite directions, and this block is how they are
# satisfied at once: these ARE named volumes (declared here, referenced by name,
# managed by `docker volume`, removed by `docker compose down -v`) whose local
# driver is told which host directory to back them with.
#
# `- /home/akuzmin/data/mariadb:/var/lib/mysql` under a service would be a bind
# mount: an anonymous host path with no volume object, invisible to
# `docker volume ls`. That is what the subject forbids.
#
# type: none + o: bind means "do not create a filesystem, bind this existing
# directory" — so the directory must already exist. `make setup` creates it.
# ---------------------------------------------------------------------------
volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akuzmin/data/mariadb

  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akuzmin/data/wordpress

  # BONUS: dedicated volume for database dumps. Deliberately a different volume
  # from mariadb-data — see the `backup` service.
  backup-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/akuzmin/data/backups

# ---------------------------------------------------------------------------
# Network. Subject: "The network line must be present in your
# docker-compose.yml file", and `network: host`, `--link` and `links:` are
# forbidden.
#
# A user-defined bridge (unlike the default docker0 bridge) gives every attached
# container an entry in Docker's embedded DNS server at 127.0.0.11. That is why
# `fastcgi_pass wordpress:9000` and `MYSQL_HOST=mariadb` work without `links:`
# and without knowing any IP address.
#
# It also provides the isolation the design relies on: only containers attached
# to inception-network can reach 3306 and 9000 at all.
# ---------------------------------------------------------------------------
networks:
  inception-network:
    driver: bridge
    name: inception-network
